version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-dependencies: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: [/sdk/typescript, /apps/dashboard, /examples/node-basic, /examples/webhook-audit, /examples/contract-workflow]
    schedule: { interval: weekly }
    groups:
      npm-dependencies: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /deployments/docker
    schedule: { interval: weekly }
