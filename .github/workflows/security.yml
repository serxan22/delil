name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Reports only vulnerabilities in code paths the binaries actually call.
      - run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          gitleaks git --redact --no-banner --verbose .

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [sdk/typescript, apps/dashboard, examples/node-basic, examples/webhook-audit, examples/contract-workflow]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Gate on everything that ships (runtime dependencies). Development-only
      # advisories are reported but do not fail the build; accepted ones are
      # listed with their justification in SECURITY.md.
      - name: Runtime dependencies (gating)
        run: npm audit --omit=dev --audit-level=low
      - name: All dependencies (report only)
        run: npm audit || echo "::warning::development dependencies have advisories; see the log and SECURITY.md"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      # Code scanning uploads need GitHub Advanced Security on private
      # repositories. Analyse anyway and gate on the SARIF results below, so
      # findings fail the build either way; upload once the repository is public.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}
          output: sarif
      # Reviewed exceptions live in .github/codeql/accepted-findings.json
      # (rule + file, with the reason). Everything else fails the job, with
      # one annotation per finding shown on the run and next to the code.
      - name: Fail on findings
        run: |
          jq --slurpfile accepted .github/codeql/accepted-findings.json '
            [ .runs[].results[]
              | {rule: .ruleId, path: .locations[0].physicalLocation.artifactLocation.uri,
                 line: .locations[0].physicalLocation.region.startLine,
                 message: ((.message.text | gsub("\n"; " ")) + " | related: "
                   + ([.relatedLocations[]? | "(\(.id)) \(.physicalLocation.artifactLocation.uri):\(.physicalLocation.region.startLine)"] | join(", ")))}
              | . as $f
              | select([$accepted[0][] | select(.rule == $f.rule and .path == $f.path)] | length == 0) ]' \
            sarif/*.sarif | jq -s 'add' > findings.json
          jq -r '.[] | "::error file=\(.path),line=\(.line),title=CodeQL \(.rule)::\(.message)"' findings.json
          count=$(jq 'length' findings.json)
          echo "CodeQL findings (after reviewed exceptions): $count"
          [ "$count" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
          retention-days: 14

  images:
    name: Container image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [server, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f deployments/docker/${{ matrix.image }}.Dockerfile -t delil-${{ matrix.image }}:scan .
      - name: Trivy (HIGH and CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            delil-${{ matrix.image }}:scan
